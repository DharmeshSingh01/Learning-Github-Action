name: my-second-workflow
on: push
jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step-2 - Checkout
        uses: actions/checkout@v6.0.2
      - name: Step-3
        run: |
          echo `pwd` >> myartifact.txt
          echo "this is test file" >> test.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
          
      - name: upload singlr file
        uses: actions/upload-artifact@v7
        with:
          name: singlefile
          path: ./myartifact.txt
      - name: Upload Directory
        uses: actions/upload-artifact@v7
        with:
          name: directory_artifact
          path: artifacts/
      - name: upload from multiple path with exclusion
        uses: actions/upload-artifact@v7
        with:
          name: multiplepath_with_exclusion
          path: |
            ./myartifact.txt
            ./test.txt
            artifacts/
            !==hostname.txt
      
      

